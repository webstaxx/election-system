<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Voting Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#111827;
    color:white;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:800px;

    background:#1f2937;

    padding:30px;

    border-radius:16px;
}

#progress{
    color:#9ca3af;
    margin-bottom:15px;
}

h1{
    margin-bottom:25px;
}

.candidate{
    background:#374151;

    padding:15px;

    margin-bottom:12px;

    border-radius:10px;

    cursor:pointer;

    transition:0.2s;
}

.candidate:hover{
    background:#4b5563;
}

.candidate.selected{
    border:2px solid #60a5fa;
}

.controls{
    margin-top:25px;

    display:flex;
    justify-content:space-between;
}

button{
    border:none;
    border-radius:10px;

    padding:12px 20px;

    cursor:pointer;
}

.next-btn{
    background:#2563eb;
    color:white;
}

.prev-btn{
    background:#374151;
    color:white;
}

.review-btn{
    background:#22c55e;
    color:white;
}

</style>
</head>

<body>

<div class="container">

    <div id="progress"></div>

    <h1 id="postTitle">
        Loading...
    </h1>

    <div id="candidates"></div>

    <div class="controls">

        <button
            class="prev-btn"
            onclick="previousPost()">

            Previous

        </button>

        <button
            class="next-btn"
            onclick="nextPost()">

            Next

        </button>

    </div>

</div>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const house =
    params.get("house");

let posts = [];

let currentPost = 0;

let ballot = {};

async function loadBallot(){

    const response =
        await fetch(
            `/vote/ballot/student/${house}`
        );

    const data =
        await response.json();

    posts = data.posts;

    renderPost();

}

function renderPost(){

    const post =
        posts[currentPost];

    document
        .getElementById(
            "progress"
        )
        .innerText =
        `Post ${currentPost+1} of ${posts.length}`;

    document
        .getElementById(
            "postTitle"
        )
        .innerText =
        post.title;

    const container =
        document.getElementById(
            "candidates"
        );

    container.innerHTML = "";

    post.candidates.forEach(
        candidate => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "candidate";

        if(
            ballot[post.id]
            === candidate.id
        ){
            div.classList.add(
                "selected"
            );
        }

        div.innerText =
            candidate.name;

        div.onclick = () => {

            ballot[post.id] =
                candidate.id;

            renderPost();

        };

        container.appendChild(
            div
        );

    });

}

function nextPost(){

    if(
        !ballot[
            posts[currentPost].id
        ]
    ){
        alert(
            "Please select a candidate."
        );
        return;
    }

    if(
        currentPost
        <
        posts.length - 1
    ){
        currentPost++;
        renderPost();
    }
    else{
        showReview();
    }

}

function previousPost(){

    if(
        currentPost > 0
    ){
        currentPost--;
        renderPost();
    }

}

function showReview(){

    let html =
        "<h1>Review Ballot</h1>";

    posts.forEach(post => {

        const candidate =
            post.candidates.find(
                c =>
                c.id ===
                ballot[post.id]
            );

        html += `
            <div class="candidate">
                <strong>
                    ${post.title}
                </strong>
                <br>
                ${candidate.name}
            </div>
        `;

    });

    html += `
        <button
            class="review-btn"
            onclick="submitBallot()">

            Submit Ballot

        </button>
    `;

    document.querySelector(
        ".container"
    ).innerHTML =
        html;

}

async function submitBallot(){

    const votes = [];

    for(
        const postId
        in ballot
    ){

        votes.push({

            post_id:
                parseInt(postId),

            candidate_id:
                ballot[postId]

        });

    }

    const response =
        await fetch(
            "/vote/submit",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    voter_type:
                        "student",

                    machine_id:
                        1,

                    votes:votes

                })
            }
        );

    const result =
        await response.json();

    if(result.success){

        alert(
            "Vote Submitted Successfully"
        );

        window.location.href =
            "/";

    }
    else{

        alert(
            result.message
        );

    }

}

loadBallot();

</script>

</body>
</html>
