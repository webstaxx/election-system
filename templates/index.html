<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Council Election 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background:#111827;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.container{
    width:90%;
    max-width:700px;

    background:#1f2937;

    padding:40px;

    border-radius:16px;

    text-align:center;
}

h1{
    margin-bottom:10px;
}

.subtitle{
    color:#9ca3af;
    margin-bottom:35px;
}

.house-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

    margin-bottom:30px;
}

.house-btn{
    padding:18px;

    border:none;

    border-radius:12px;

    background:#374151;

    color:white;

    font-size:1rem;

    cursor:pointer;

    transition:0.2s;
}

.house-btn:hover{
    background:#4b5563;
}

.teacher-btn{
    width:100%;

    padding:18px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:1rem;

    cursor:pointer;
}

.teacher-btn:hover{
    background:#1d4ed8;
}

.footer{
    margin-top:25px;

    color:#6b7280;

    font-size:0.9rem;
}

</style>
</head>

<body>

<div class="container">

    <h1>
        Student Council Election 2026
    </h1>

    <p class="subtitle">
        Select your house to begin voting
    </p>

    <div class="house-grid">

        <button
            class="house-btn"
            onclick="selectHouse('agni')">
            🔥 Agni
        </button>

        <button
            class="house-btn"
            onclick="selectHouse('jalam')">
            💧 Jalam
        </button>

        <button
            class="house-btn"
            onclick="selectHouse('vayu')">
            🌪️ Vayu
        </button>

        <button
            class="house-btn"
            onclick="selectHouse('prithvi')">
            🌱 Prithvi
        </button>

    </div>

    <button
        class="teacher-btn"
        onclick="teacherPortal()">

        Teacher Portal

    </button>

    <div class="footer">
        Sandeepani Vidya Nikethan
    </div>

</div>

<script>

function selectHouse(house){

    window.location.href =
        `/student?house=${house}`;

}

function teacherPortal(){

    window.location.href =
        "/teacher_vote.html";

}

</script>

</body>
</html>
