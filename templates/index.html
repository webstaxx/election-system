<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Council Election 2026 · Sandeepani Vidya Nikethan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>

/* ── Reset ──────────────────────────────────────── */
*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
}

/* ── Tokens ─────────────────────────────────────── */
:root {
  --agni:           #b91c1c;
  --agni-border:    rgba(255, 0, 0, 0.4);

  --jalam:          #1d4ed8;
  --jalam-border:   rgba(29,78,216,0.40);

  --vayu:           #E3940C;
  --vayu-border:    rgba(180,83,9,0.40);

  --prithvi:        #166534;
  --prithvi-border: rgba(22,101,52,0.40);

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── Page ───────────────────────────────────────── */
html, body {
  height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
}

body {
  min-height: 100vh;
  background-image: url('{{ url_for("static", filename="school.jpg") }}');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 40px 20px 48px;
  position: relative;
}

/* Overlay — darkens photo enough for white text to breathe */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(8, 15, 35, 0.65) 0%,
    rgba(8, 15, 35, 0.55) 45%,
    rgba(8, 15, 35, 0.70) 100%
  );
  z-index: 0;
}

/* ════════════════════════════════════════
   ZONE A — Identity, floats on the photo
════════════════════════════════════════ */
.zone-a {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-bottom: 32px;
}

.school-logo {
  width: 80px;
  height: 80px;
  object-fit: contain;
  border-radius: 18px;
  filter: drop-shadow(0 0 16px rgba(255,255,255,0.22))
          drop-shadow(0 4px 14px rgba(0,0,0,0.40));
  margin-bottom: 18px;
}

.school-name {
  font-size: clamp(1.05rem, 2.5vw, 1.25rem);
  font-weight: 700;
  letter-spacing: .20em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.70);
}

/* Thin rule flanking the school name */
.school-name-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}

.rule {
  height: 1px;
  width: 36px;
  background: rgba(255,255,255,0.28);
  border-radius: 1px;
  flex-shrink: 0;
}

.portal-title {
  font-size: clamp(1.65rem, 4.5vw, 2.4rem);
  font-weight: 900;
  letter-spacing: -.03em;
  line-height: 1.08;
  color: #ffffff;
  text-shadow: 0 2px 24px rgba(0,0,0,0.35);
  margin-bottom: 6px;
}

.portal-year {
  font-size: clamp(1rem, 2.5vw, 1.15rem);
  font-weight: 500;
  letter-spacing: .04em;
  color: rgba(255,255,255,0.52);
}

/* ════════════════════════════════════════
   ZONE B — Isolated House Grid
════════════════════════════════════════ */
.zone-b-grid {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 520px;
}

/* Small prompt above the grid */
.grid-label {
  text-align: center;
  margin-bottom: 20px;
}

.grid-label-text {
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.6);
}

/* 2×2 grid */
.house-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

/* ── House card ── */
.house-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 24px 22px 20px;
  /* Completely transparent glass base at rest */
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(20px) saturate(120%);
  -webkit-backdrop-filter: blur(20px) saturate(120%);
  /* Uses a faint, color-coded border outline */
  border: 1px solid var(--card-default-border);
  border-radius: 18px;
  cursor: pointer;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition:
    transform    .24s var(--ease),
    background   .24s var(--ease),
    border-color .24s var(--ease),
    box-shadow   .24s var(--ease);
  /* Appends a tiny micro-glow onto the border shape */
  box-shadow: 
    0 4px 14px rgba(0, 0, 0, 0.15),
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    var(--card-default-glow);
}

/* Left accent bar — grows on hover */
.house-card::before {
  content: '';
  position: absolute;
  left: 0; top: 16px; bottom: 16px;
  width: 0;
  border-radius: 0 3px 3px 0;
  background: var(--card-theme);
  transition: width .22s var(--ease);
}

.house-card:hover::before { width: 3px; }

/* Triggers the dip-to-clear then explode-to-glow sequence */
.house-card:hover { 
  transform: translateY(-4px); 
  animation: dip-and-glow 0.48s var(--ease) forwards;
}
.house-card:active { transform: translateY(-1px) scale(0.984); }

/* The custom animation flow handles the visual dip */
@keyframes dip-and-glow {
  0% {
    background: rgba(255, 255, 255, 0);
    border-color: rgba(255, 255, 255, 0.08);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
  }
  20% {
    background: rgba(255, 255, 255, 0);
    border-color: rgba(255, 255, 255, 0.08);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
  }
  100% {
    background: var(--card-hover-bg);
    border-color: var(--card-border);
    box-shadow: var(--card-hover-shadow);
  }
}

/* Icon */
.house-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  flex-shrink: 0;
  transition: background .22s var(--ease), border-color .22s var(--ease);
}

.house-icon svg { width: 20px; height: 20px; }

.house-icon svg path {
  stroke: rgba(255, 255, 255, 0.65);
  transition: stroke .22s var(--ease);
}

.house-name {
  font-size: 1.18rem;
  font-weight: 800;
  letter-spacing: -.015em;
  color: #ffffff;
  line-height: 1;
  margin-bottom: 4px;
  transition: color .2s var(--ease);
}

.house-element {
  font-size: .63rem;
  font-weight: 600;
  letter-spacing: .10em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.45);
}

/* Arrow circle */
.house-arrow {
  position: absolute;
  bottom: 18px; right: 18px;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: transparent;
  border: 1.5px solid rgba(255, 255, 255, 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  transition:
    background   .2s var(--ease),
    border-color .2s var(--ease),
    transform    .2s var(--ease);
}

.house-arrow svg { width: 12px; height: 12px; }

.house-arrow svg path {
  stroke: rgba(255, 255, 255, 0.55);
  transition: stroke .2s var(--ease);
}

/* ── Per-house configs (Custom Initial Borders & Glow Ecosystems) ── */
.agni-card  { 
  --card-theme: var(--agni);   
  --card-border: var(--agni-border);   
  --card-default-border: rgba(185, 28, 28, 0.28);
  --card-default-glow: 0 0 12px rgba(185, 28, 28, 0.08);
  --card-hover-bg: rgba(185, 28, 28, 0.15); 
  --card-hover-shadow: 0 12px 32px rgba(185, 28, 28, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2); 
}
.agni-card:hover .house-name               { color: #ffffff; }
.agni-card:hover .house-icon               { background: rgba(185, 28, 28, 0.25); border-color: var(--agni-border); }
.agni-card:hover .house-icon svg path      { stroke: #ff6b6b; }
.agni-card:hover .house-arrow              { background: var(--agni); border-color: var(--agni); transform: scale(1.1); }
.agni-card:hover .house-arrow svg path     { stroke: #fff; }

.jalam-card { 
  --card-theme: var(--jalam);  
  --card-border: var(--jalam-border);  
  --card-default-border: rgba(29, 78, 216, 0.28);
  --card-default-glow: 0 0 12px rgba(29, 78, 216, 0.08);
  --card-hover-bg: rgba(29, 78, 216, 0.15); 
  --card-hover-shadow: 0 12px 32px rgba(29, 78, 216, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2); 
}
.jalam-card:hover .house-name              { color: #ffffff; }
.jalam-card:hover .house-icon              { background: rgba(29, 78, 216, 0.25); border-color: var(--jalam-border); }
.jalam-card:hover .house-icon svg path     { stroke: #60a5fa; }
.jalam-card:hover .house-arrow             { background: var(--jalam); border-color: var(--jalam); transform: scale(1.1); }
.jalam-card:hover .house-arrow svg path    { stroke: #fff; }

.vayu-card  { 
  --card-theme: var(--vayu);   
  --card-border: var(--vayu-border);   
  --card-default-border: rgba(227, 148, 12, 0.28);
  --card-default-glow: 0 0 12px rgba(227, 148, 12, 0.08);
  --card-hover-bg: rgba(227, 148, 12, 0.15); 
  --card-hover-shadow: 0 12px 32px rgba(227, 148, 12, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2); 
}
.vayu-card:hover .house-name               { color: #ffffff; }
.vayu-card:hover .house-icon               { background: rgba(227, 148, 12, 0.25); border-color: var(--vayu-border); }
.vayu-card:hover .house-icon svg path      { stroke: #fbbf24; }
.vayu-card:hover .house-arrow              { background: var(--vayu); border-color: var(--vayu); transform: scale(1.1); }
.vayu-card:hover .house-arrow svg path     { stroke: #fff; }

.prithvi-card { 
  --card-theme: var(--prithvi); 
  --card-border: var(--prithvi-border); 
  --card-default-border: rgba(22, 101, 52, 0.28);
  --card-default-glow: 0 0 12px rgba(22, 101, 52, 0.08);
  --card-hover-bg: rgba(22, 101, 52, 0.15); 
  --card-hover-shadow: 0 12px 32px rgba(22, 101, 52, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2); 
}
.prithvi-card:hover .house-name            { color: #ffffff; }
.prithvi-card:hover .house-icon            { background: rgba(22, 101, 52, 0.25); border-color: var(--prithvi-border); }
.prithvi-card:hover .house-icon svg path   { stroke: #4ade80; }
.prithvi-card:hover .house-arrow           { background: var(--prithvi); border-color: var(--prithvi); transform: scale(1.1); }
.prithvi-card:hover .house-arrow svg path  { stroke: #fff; }

.house-card:focus-visible {
  outline: 3px solid rgba(255,255,255,0.4);
  outline-offset: 3px;
}

/* Standalone Page Footer */
.page-footer {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 32px;
}

.footer-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 6px rgba(34,197,94,0.70);
  animation: pulse 2s ease-in-out infinite;
  flex-shrink: 0;
}

.footer-dot.closed {
  background: #ef4444;
  box-shadow: 0 0 6px rgba(239,68,68,0.7);
}

.footer-dot.open {
  background: #22c55e;
  box-shadow: 0 0 6px rgba(34,197,94,0.7);
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.30; }
}

.footer-text {
  font-size: .65rem;
  font-weight: 600;
  letter-spacing: .08em;
  color: rgba(255, 255, 255, 0.5);
  text-transform: uppercase;
}

/* ── Responsive ── */
@media (max-width: 480px) {
  body           { padding: 32px 16px 40px; }
  .school-logo   { width: 64px; height: 64px; }
  .zone-a        { padding-bottom: 24px; }
  .house-card    { padding: 20px 18px 16px; border-radius: 16px; }
  .house-name    { font-size: 1.05rem; }
  .house-icon    { width: 36px; height: 36px; margin-bottom: 12px; }
}

@media (max-width: 340px) {
  .house-grid { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  .house-card, .house-card::before,
  .house-icon, .house-arrow,
  .house-name, .footer-dot { transition: none; animation: none; }
}

</style>
</head>
<body>

  <div class="zone-a">

    <img
      class="school-logo"
      src="{{ url_for('static', filename='logo.png') }}"
      alt="Sandeepani Vidya Nikethan"
      onerror="this.style.display='none'"
    >

    <div class="school-name-wrap">
      <span class="rule"></span>
      <span class="school-name">Sandeepani Vidya Nikethan</span>
      <span class="rule"></span>
    </div>

    <h1 class="portal-title">Student Council<br>Election Portal</h1>
    <p class="portal-year">Academic Year 2026</p>

  </div>

  <div class="zone-b-grid">

    <div class="grid-label">
      <span class="grid-label-text">Choose your house to vote</span>
    </div>

    <div class="house-grid">

      <div class="house-card agni-card"
           role="button" tabindex="0"
           aria-label="Vote as Agni house"
           onclick="selectHouse('agni')"
           onkeydown="if(event.key==='Enter'||event.key===' ')selectHouse('agni')">
        <div class="house-icon">
          <svg viewBox="0 0 20 20" fill="none">
            <path d="M10 17c-3.866 0-7-2.91-7-6.5 0-2.5 1.5-4.5 3-5.5
                     0 2 1 3 2 3-1-3 1-6 4-7-1 3 1.5 4.5 1.5 6.5
                     1-1 1-2.5 1-3.5 2 1.5 2.5 4 2.5 5.5C17 14.09 13.866 17 10 17Z"
                  stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="house-name">Agni</div>
        <div class="house-element">Fire · Strength</div>
        <div class="house-arrow">
          <svg viewBox="0 0 14 14" fill="none">
            <path d="M3 7h8M8 4l3 3-3 3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="house-card jalam-card"
           role="button" tabindex="0"
           aria-label="Vote as Jalam house"
           onclick="selectHouse('jalam')"
           onkeydown="if(event.key==='Enter'||event.key===' ')selectHouse('jalam')">
        <div class="house-icon">
          <svg viewBox="0 0 20 20" fill="none">
            <path d="M10 3C10 3 4 9 4 13a6 6 0 0012 0c0-4-6-10-6-10Z"
                  stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="house-name">Jalam</div>
        <div class="house-element">Water · Wisdom</div>
        <div class="house-arrow">
          <svg viewBox="0 0 14 14" fill="none">
            <path d="M3 7h8M8 4l3 3-3 3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

    <!-- Vayu (Authentic Minimalist Wind Lines) -->
    <div class="house-card vayu-card"
        role="button" tabindex="0"
        aria-label="Vote as Vayu house"
        onclick="selectHouse('vayu')"
        onkeydown="if(event.key==='Enter'||event.key===' ')selectHouse('vayu')">
    <div class="house-icon">
        <svg viewBox="0 0 20 20" fill="none">
        <path d="M3 6h11a2 2 0 1 0-2-2" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M2 10h13a2 2 0 1 1-2 2" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M4 14h8a2 2 0 1 0-2-2" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
    </div>
    <div class="house-name">Vayu</div>
    <div class="house-element">Air · Agility</div>
    <div class="house-arrow">
        <svg viewBox="0 0 14 14" fill="none">
        <path d="M3 7h8M8 4l3 3-3 3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>
    </div>

    <!-- Prithvi (Sleek Tilted Leaf Outline) -->
    <div class="house-card prithvi-card"
        role="button" tabindex="0"
        aria-label="Vote as Prithvi house"
        onclick="selectHouse('prithvi')"
        onkeydown="if(event.key==='Enter'||event.key===' ')selectHouse('prithvi')">
    <div class="house-icon">
        <svg viewBox="0 0 20 20" fill="none">
        <g transform="rotate(25 10 10)">
            <!-- Clean Leaf Outline -->
            <path d="M10 15C5.5 11.5 5.5 6.5 10 3.5C14.5 6.5 14.5 11.5 10 15Z" 
                stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Main Stem & Center Vein -->
            <path d="M10 18V3.5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        </svg>
    </div>
    <div class="house-name">Prithvi</div>
    <div class="house-element">Earth · Unity</div>
    <div class="house-arrow">
        <svg viewBox="0 0 14 14" fill="none">
        <path d="M3 7h8M8 4l3 3-3 3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>
    </div>

    </div></div>
    <!-- Footer -->
    <div class="page-footer">
    <span class="footer-dot" id="footerDot" aria-hidden="true"></span>
    <span class="footer-text" id="footerStatus">
        Checking Election Status...
    </span>
    </div>

<script>
function selectHouse(house) {
  window.location.href = `/student?house=${house}`;
}

async function loadElectionStatus() {
  try {
    const response = await fetch('/admin/status');
    const data = await response.json();

    const footerText = document.getElementById('footerStatus');
    const footerDot = document.getElementById('footerDot');

    if (data.election_open) {
      footerText.innerHTML =
        'Sandeepani Vidya Nikethan &nbsp;·&nbsp; Election Active';

      footerDot.classList.remove('closed');
      footerDot.classList.add('open');
    } else {
      footerText.innerHTML =
        'Sandeepani Vidya Nikethan &nbsp;·&nbsp; Election Closed';

      footerDot.classList.remove('open');
      footerDot.classList.add('closed');
    }
  } catch (error) {
    console.error('Failed to load election status:', error);

    document.getElementById('footerStatus').innerHTML =
      'Sandeepani Vidya Nikethan &nbsp;·&nbsp; Status Unavailable';
  }
}

loadElectionStatus();
</script>

</body>
</html>
