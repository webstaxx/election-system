<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Council Election 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', system-ui, sans-serif;
}

body {
    /* OFFLINE FLASK PATH FOR LOCAL STATIC SERVER IMAGE */
    background-image: url('{{ url_for("static", filename="school.jpg") }}');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #0f172a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 20px;
}

/* Dark layout tint so the premium glass elements break away beautifully */
body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at center, rgba(15, 23, 42, 0.3) 0%, rgba(15, 23, 42, 0.6) 100%);
    z-index: 0;
}

/* ── Elite Glassmorphic Portal Container ── */
.container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 580px;
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(25px) saturate(180%);
    -webkit-backdrop-filter: blur(25px) saturate(180%);
    padding: 45px 35px;
    border-radius: 24px;
    box-shadow: 
        0 4px 30px rgba(0, 0, 0, 0.05),
        0 20px 50px rgba(0, 0, 0, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.4);
    text-align: center;
}

h1 {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    margin-bottom: 8px;
    color: #0f172a;
}

.subtitle {
    color: #334155;
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: 35px;
}

/* ── House Grid Layout ── */
.house-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 24px;
}

/* Base Glassmorphic Button Design */
.house-btn {
    padding: 20px;
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(5px);
    color: #1e293b;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}

.house-btn:active {
    transform: scale(0.97);
}

/* Custom Individual Elemental Glows on Hover */
.house-btn.agni-btn:hover {
    background: rgba(255, 30, 30, 0.15);
    border-color: rgba(255, 30, 30, 0.4);
    box-shadow: 0 0 0 2px #ff1e1e, 0 8px 20px rgba(255, 30, 30, 0.15);
    transform: translateY(-2px);
    color: #000000;
}

.house-btn.jalam-btn:hover {
    background: rgba(0, 102, 255, 0.15);
    border-color: rgba(0, 102, 255, 0.4);
    box-shadow: 0 0 0 2px #0066ff, 0 8px 20px rgba(0, 102, 255, 0.15);
    transform: translateY(-2px);
    color: #000000;
}

.house-btn.vayu-btn:hover {
    background: rgba(255, 170, 0, 0.15);
    border-color: rgba(255, 170, 0, 0.4);
    box-shadow: 0 0 0 2px #ffaa00, 0 8px 20px rgba(255, 170, 0, 0.15);
    transform: translateY(-2px);
    color: #000000;
}

.house-btn.prithvi-btn:hover {
    background: rgba(0, 200, 83, 0.15);
    border-color: rgba(0, 200, 83, 0.4);
    box-shadow: 0 0 0 2px #00c853, 0 8px 20px rgba(0, 200, 83, 0.15);
    transform: translateY(-2px);
    color: #000000;
}

/* ── Solid Purple Teacher Button ── */
.teacher-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: #8b5cf6; /* Matches teacher portal badge exactly */
    color: white;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 6px 16px rgba(139, 92, 246, 0.3);
}

.teacher-btn:hover {
    filter: brightness(1.1);
    box-shadow: 0 8px 22px rgba(139, 92, 246, 0.45);
}

.teacher-btn:active {
    transform: scale(0.98);
}

/* ── Footer ── */
.footer {
    margin-top: 30px;
    color: #475569;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Student Council Election 2026</h1>
    <p class="subtitle">Select your house to begin voting</p>

    <div class="house-grid">
        <button class="house-btn agni-btn" onclick="selectHouse('agni')">🔥 Agni</button>
        <button class="house-btn jalam-btn" onclick="selectHouse('jalam')">💧 Jalam</button>
        <button class="house-btn vayu-btn" onclick="selectHouse('vayu')">🌪️ Vayu</button>
        <button class="house-btn prithvi-btn" onclick="selectHouse('prithvi')">🌱 Prithvi</button>
    </div>

    <button class="teacher-btn" onclick="teacherPortal()">Teacher Portal</button>

    <div class="footer">Sandeepani Vidya Nikethan</div>
</div>

<script>
function selectHouse(house) {
    window.location.href = `/student?house=${house}`;
}

function teacherPortal() {
    window.location.href = "/teacher";
}
</script>

</body>
</html>
