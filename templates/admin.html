<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Election Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#111827;
    color:white;
    min-height:100vh;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:25px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

#statusBadge{
    padding:12px 20px;
    border-radius:999px;
    font-weight:bold;
}

.stats-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));
    gap:20px;

    margin-bottom:25px;
}

.card{
    background:#1f2937;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

.card h3{
    color:#9ca3af;
    margin-bottom:10px;
}

.card p{
    font-size:2rem;
    font-weight:bold;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(350px,1fr));
    gap:20px;
}

.panel{
    background:#1f2937;
    border-radius:12px;
    padding:20px;
}

.panel h2{
    margin-bottom:15px;
}

button{
    width:100%;
    border:none;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
    color:white;
    font-weight:600;
}

.primary{
    background:#2563eb;
}

.success{
    background:#16a34a;
}

.danger{
    background:#dc2626;
}

.secondary{
    background:#374151;
}

</style>

</head>

<body>

<div class="container">

<header>

    <h1>🗳 Election Dashboard</h1>

    <div id="statusBadge">
        Loading...
    </div>

</header>

<div class="stats-grid">

    <div class="card">
        <h3>Total Ballots</h3>
        <p id="totalBallots">0</p>
    </div>

    <div class="card">
        <h3>Student Ballots</h3>
        <p id="studentBallots">0</p>
    </div>

    <div class="card">
        <h3>Teacher Ballots</h3>
        <p id="teacherBallots">0</p>
    </div>

    <div class="card">
        <h3>Total Votes</h3>
        <p id="totalVotes">0</p>
    </div>

</div>

<div class="dashboard-grid">

    <div class="panel">

        <h2>Election Controls</h2>

        <button
            id="toggleElectionBtn"
            onclick="toggleElection()">

            Loading...

        </button>

    </div>

    <div class="panel">

        <h2>Management</h2>

        <button
            class="primary"
            onclick="location.href='/admin/manage'">

            👥 Manage Candidates & Posts

        </button>

    </div>

    <div class="panel">

        <h2>Results</h2>

        <button
            class="primary"
            onclick="location.href='/results-page'">

            📊 View Results

        </button>

    </div>

    <div class="panel">

        <h2>Exports</h2>

        <button
            class="secondary"
            onclick="location.href='/admin/export/csv'">

            💾 Export CSV

        </button>

    </div>

</div>

</div>

<script>

async function loadStatus(){

    const response =
        await fetch("/admin/status");

    const data =
        await response.json();

    const badge =
        document.getElementById(
            "statusBadge"
        );

    const btn =
        document.getElementById(
            "toggleElectionBtn"
        );

    if(data.election_open){

        badge.innerText =
            "🟢 ELECTION OPEN";

        badge.style.background =
            "#16a34a";

        btn.innerText =
            "Close Election";

        btn.className =
            "danger";

    }
    else{

        badge.innerText =
            "🔴 ELECTION CLOSED";

        badge.style.background =
            "#dc2626";

        btn.innerText =
            "Open Election";

        btn.className =
            "success";

    }

}

async function toggleElection(){

    const open =
        document
        .getElementById(
            "statusBadge"
        )
        .innerText
        .includes("OPEN");

    const endpoint =
        open
        ? "/admin/close-election"
        : "/admin/open-election";

    await fetch(
        endpoint,
        {
            method:"PUT"
        }
    );

    loadStatus();

}

loadStatus();

</script>

</body>
</html>
